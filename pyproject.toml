[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kachysec"
version = "0.1.0"
description = "Read-only security workstation baseline scanner for CachyOS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kachysec = "kachysec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
